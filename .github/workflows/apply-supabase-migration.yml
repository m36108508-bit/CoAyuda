name: Apply Supabase Migration

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Run migration SQL via psql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run migration SQL
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "Set the SUPABASE_DATABASE_URL secret (full Postgres connection string) in repository secrets.";
            exit 1;
          fi
          echo "Running migration against SUPABASE_DATABASE_URL"
          psql "$SUPABASE_DATABASE_URL" -f supabase/migrations/0001_owner_device_migration.sql
